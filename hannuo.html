<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉诺塔</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Serif SC',serif;color:#24325c;
  background:
    radial-gradient(1200px 700px at 50% -10%, #ffffff, transparent 60%),
    linear-gradient(180deg,#eaf1fb 0%, #d9e5f7 100%);
  display:flex;justify-content:center;
}
.wrap{width:min(1600px,96vw);display:flex;flex-direction:column;align-items:center;
  gap:10px;padding:14px 0 18px}
h1{font-size:clamp(26px,4.2vh,44px);letter-spacing:.4em;text-indent:.4em;color:#2547a8;
  text-shadow:0 2px 0 rgba(255,255,255,.8)}
.hint{color:#4d5f8f;font-size:clamp(12px,1.7vh,15px);letter-spacing:.12em}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.bar .stat{font-size:14px;color:#33416b;background:#ffffff;border:1px solid #bfcdee;
  border-radius:16px;padding:7px 16px;box-shadow:0 2px 6px rgba(50,80,150,.12)}
.bar b{color:#1f5fd0;font-family:Cinzel,serif;font-size:17px}
.btn{font:inherit;font-size:14px;font-weight:700;letter-spacing:.08em;color:#ffffff;
  padding:8px 18px;border-radius:16px;cursor:pointer;
  background:linear-gradient(180deg,#4a7bea,#2d55c9);border:1px solid #24479f;
  box-shadow:0 3px 8px rgba(40,70,160,.28)}
.btn:active{transform:translateY(1px)}
#status{min-height:22px;font-size:14px;color:#3d4f7a;letter-spacing:.06em}
#board{position:relative;
  width:clamp(320px, min(96vw, calc((100dvh - 240px) * 16 / 9)), 1600px);
  aspect-ratio:16/9;
  border:1px solid #a9bce4;border-radius:24px;overflow:hidden;
  box-shadow:0 24px 60px rgba(40,70,140,.22), inset 0 0 0 1px rgba(255,255,255,.7);
  background:
    radial-gradient(120% 150% at 50% -20%, #ffffff, transparent 55%),
    linear-gradient(180deg,#f4f8ff 0%, #e2ebfb 100%)}
.pg{position:absolute;top:0;bottom:0;width:32%}
.pg .rod{position:absolute;left:50%;bottom:15.5556%;width:14px;height:69.4444%;
  border-radius:6px;transform:translateX(-50%);
  background:linear-gradient(90deg,#cdd7ef 0%,#8fa0cc 45%,#aab8df 100%);
  box-shadow:0 4px 10px rgba(70,95,160,.30);
  transition:box-shadow .15s ease}
.pg:nth-child(1){left:0}
.pg:nth-child(2){left:34%}
.pg:nth-child(3){left:68%}
.pg .top{position:absolute;left:0;right:0;top:9%;font-size:clamp(11px,1.6vh,14px);
  color:#5b6a96;letter-spacing:.3em}
.pg.drop-ok .rod{box-shadow:0 0 0 3px rgba(35,170,95,.55), 0 0 26px rgba(35,170,95,.55)}
.pg.drop-bad .rod{box-shadow:0 0 0 3px rgba(225,60,50,.55), 0 0 26px rgba(225,60,50,.5)}
.discs{position:absolute;inset:0;z-index:20;pointer-events:none}
.disc{position:absolute;height:6.6667%;border-radius:999px;pointer-events:auto;
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(140% 100% at 50% 8%, rgba(255,255,255,.65), transparent 45%),
    linear-gradient(180deg,var(--c1),var(--c2) 62%, rgba(0,0,0,.35) 66%, var(--c2));
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 6px 14px rgba(45,65,120,.30), inset 0 -3px 6px rgba(0,0,0,.28), inset 0 3px 6px rgba(255,255,255,.5);
  transition:left .22s ease-in-out, bottom .16s ease, transform .12s ease;
  transform:translateX(-50%)}
.disc.dragging{transition:none;cursor:grabbing;z-index:200;
  transform:translateX(-50%) scale(1.07);
  box-shadow:0 18px 34px rgba(35,55,110,.45), inset 0 -3px 6px rgba(0,0,0,.28), inset 0 3px 6px rgba(255,255,255,.5)}
.disc .grab{width:12px;height:12px;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(0,0,0,.22)}
</style>
</head>
<body>
<div class="wrap">
  <h1>汉诺塔</h1>
  <div class="hint">按住圆盘拖到另一根柱子上 · 把全部圆盘搬到第 ③ 根</div>
  <div class="bar">
    <span class="stat">时间 <b id="clock">00:00</b></span>
    <span class="stat">步数 <b id="moves">0</b></span>
    <span class="stat">失误 <b id="miss" style="color:#d9483c">0</b>/3</span>
    <span class="stat">纪录 <b id="record">—</b></span>
    <button class="btn" id="btnNew">新的一局</button>
    <button class="btn" id="btnGiveUp">放弃 · 看解法</button>
    <button class="btn" id="btnSound">🔊</button>
  </div>
  <div id="board">
    <div class="pg"><span class="top">① 起点</span><i class="rod"></i></div>
    <div class="pg"><span class="top">② 中转</span><i class="rod"></i></div>
    <div class="pg"><span class="top">③ 终点</span><i class="rod"></i></div>
    <div id="discs"></div>
  </div>
  <div id="status">按住最上面的圆盘开始拖动吧。</div>
</div>

<script>
'use strict';
const N=5;
const P=[[],[],[]];
let discs=[];
let moves=0, miss=0, running=false, done=false;
let t0=0, elapsed=0, timer=null;
let soundOn=true;
let BEST={}; try{ BEST=JSON.parse(localStorage.getItem('hanoi-best'))||{}; }catch(e){}

const $=s=>document.querySelector(s);
const $a=s=>Array.from(document.querySelectorAll(s));
const discLayer=$('#discs');
const board=$('#board');
const pegX=[16,50,84];
const BASE=15.5556, STEP=6.6667;
const wPct=i=>(29-i*((29-9)/(N-1))).toFixed(2);
const ROMAN=['①','②','③'];
let drag=null;

function say(s){ $('#status').textContent=s; }
function fmt(ms){ const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function pIdx(id){ for(let p=0;p<3;p++){ const k=P[p].indexOf(id); if(k!==-1) return p; } return -1; }
function topOf(p){ return P[p].length?P[p][P[p].length-1]:-1; }
function ok(f,t){
  if(f===t||!P[f].length) return false;
  if(!P[t].length) return true;
  return topOf(f)>topOf(t);
}
function pegAt(clientX){
  const r=board.getBoundingClientRect();
  const x=clientX-r.left;
  if(x<-30||x>r.width+30) return -1;
  let best=-1,bd=1e9;
  pegX.forEach((c,i)=>{ const d=Math.abs(x-c/100*r.width); if(d<bd){bd=d;best=i;} });
  return best;
}
function markDrop(to){
  $a('.pg').forEach((el,i)=>{
    el.classList.toggle('drop-ok', i===to && to!==drag.from && ok(drag.from,to));
    el.classList.toggle('drop-bad', i===to && to!==drag.from && !ok(drag.from,to));
  });
}
function clearDrop(){ $a('.pg').forEach(el=>{ el.classList.remove('drop-ok'); el.classList.remove('drop-bad'); }); }

function build(){
  for(const a of P) a.length=0;
  discLayer.innerHTML='';
  discs=[];
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='disc';
    d.dataset.id=i;
    d.style.width=wPct(i)+'%';
    d.style.setProperty('--c1',`hsl(${(i*62+8)%360},76%,58%)`);
    d.style.setProperty('--c2',`hsl(${(i*62+8)%360},72%,40%)`);
    d.innerHTML='<i class="grab"></i>';
    d.addEventListener('pointerdown',onDown);
    discLayer.appendChild(d);
    discs[i]=d;
    P[0].push(i);
  }
  place();
}
function place(){
  for(let i=0;i<N;i++){
    const p=pIdx(i);
    const el=discs[i];
    el.style.top='auto';
    el.style.left=pegX[p]+'%';
    el.style.bottom=(BASE+P[p].indexOf(i)*STEP).toFixed(3)+'%';
    el.style.zIndex=(40+i)+'';
  }
}

function tick(){ $('#clock').textContent=fmt(running?elapsed+Date.now()-t0:elapsed); }
function startTimer(){ if(running) return; running=true; t0=Date.now(); timer=setInterval(tick,200); }
function stopTimer(){ if(!running) return; elapsed+=Date.now()-t0; running=false; clearInterval(timer); timer=null; tick(); }

let AC=null;
function beep(freq,dur,type){
  if(!soundOn) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.15,n);
    g.gain.exponentialRampToValueAtTime(0.001,n+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n+dur);
  }catch(e){}
}

function showRecord(){
  const b=BEST[N];
  $('#record').textContent=b?(b.m+' 步 / '+fmt(b.t*1000)):'—';
}
function gameOver(){
  done=true; stopTimer();
  beep(200,0.3,'square');
  say('失误满 3 次，本局结束。点击「新的一局」重新开始。');
}
function win(){
  done=true; stopTimer();
  beep(784,0.12); setTimeout(()=>beep(988,0.12),130); setTimeout(()=>beep(1175,0.22),260);
  const sec=Math.floor(elapsed/1000);
  const old=BEST[N];
  const better=!old||moves<old.m||(moves===old.m&&sec<old.t);
  if(better){
    BEST[N]={m:moves,t:sec};
    try{ localStorage.setItem('hanoi-best',JSON.stringify(BEST)); }catch(e){}
    showRecord();
  }
  say(`过关！共 ${moves} 步，用时 ${fmt(elapsed)}。${better?' 破纪录！':''}`);
}

function onDown(e){
  if(done){ say('本局已结束，请点击「新的一局」。'); return; }
  const el=e.currentTarget;
  const id=+el.dataset.id;
  const p=pIdx(id);
  if(topOf(p)!==id){ say('只能移动最上面的圆盘。'); return; }
  e.preventDefault();
  const r=board.getBoundingClientRect();
  const d=el.getBoundingClientRect();
  drag={id, from:p, el, moved:false,
        offX:e.clientX-(d.left+d.width/2),
        offY:e.clientY-d.top,
        sx:e.clientX, sy:e.clientY};
  el.classList.add('dragging');
  beep(560,0.05);
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  onMove(e);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
}
function onMove(e){
  if(!drag) return;
  if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6) drag.moved=true;
  const r=board.getBoundingClientRect();
  drag.el.style.left=(e.clientX-r.left-drag.offX)+'px';
  drag.el.style.top=(e.clientY-r.top-drag.offY)+'px';
  drag.el.style.bottom='auto';
  markDrop(pegAt(e.clientX));
}
function endDrag(){
  if(!drag) return;
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  drag.el.classList.remove('dragging');
  clearDrop();
  drag=null;
}
function onUp(e){
  if(!drag) return;
  const from=drag.from, id=drag.id, moved=drag.moved;
  endDrag();
  const to=pegAt(e.clientX);
  if(!moved){ place(); say('按住圆盘拖到另一根柱子上。'); return; }
  if(to<0||to===from){ place(); say('已放回原处。'); return; }
  if(!ok(from,to)){
    miss++; $('#miss').textContent=miss;
    beep(160,0.18,'square');
    place();
    say(`不能把大圆盘压在小圆盘上！失误 ${miss}/3`);
    if(miss>=3) gameOver();
    return;
  }
  P[to].push(P[from].pop());
  moves++; $('#moves').textContent=moves;
  place(); startTimer();
  beep(660+(N-1-id)*40,0.07);
  if(P[2].length===N) win();
  else say(`第 ${ROMAN[from]} → 第 ${ROMAN[to]}，继续加油。`);
}

function newGame(){
  endDrag();
  stopDemo();                                 // 新的一局也要取消尚未播完的演示
  if(timer){ clearInterval(timer); timer=null; }
  running=false; done=false; elapsed=0;
  moves=0; miss=0;
  $('#moves').textContent='0'; $('#miss').textContent='0'; $('#clock').textContent='00:00';
  build(); showRecord();
  say(`新的一局：把 ${N} 个圆盘全部拖到第 ③ 根柱子。`);
}

/* ---- 演示：自动走一遍最少步数解法 ---- */
let demoTimer=null, demo=false;
const DEMO_STEP=450;                         // 每步间隔（毫秒）
const giveUpBtn=$('#btnGiveUp');

// 经典递归解法，得到最短的 2^N-1 步序列
function solve(n,f,t,v,acc){
  if(!n) return acc;
  solve(n-1,f,v,t,acc);
  acc.push([f,t]);
  solve(n-1,v,t,f,acc);
  return acc;
}
// 把某一根柱子上最上面的圆盘移到另一根（演示用，不做合法性判定）
function stepMove(f,t){
  if(!P[f].length) return;
  const id=P[f][P[f].length-1];
  P[t].push(P[f].pop());
  moves++; $('#moves').textContent=moves;
  place();
  beep(660+(N-1-id)*40,0.07);
}
function stopDemo(msg){
  if(demoTimer){ clearTimeout(demoTimer); demoTimer=null; }
  demo=false;
  giveUpBtn.textContent='放弃 · 看解法';
  if(msg) say(msg);
}
function playDemo(seq,i){
  if(!demo) return;
  if(i>=seq.length){
    demo=false; giveUpBtn.textContent='再看一遍';
    beep(784,0.12); setTimeout(()=>beep(988,0.12),130); setTimeout(()=>beep(1175,0.22),260);
    say(`演示结束：${seq.length} 步最少步数解法。点「新的一局」自己试试。`);
    return;
  }
  const [f,t]=seq[i];
  stepMove(f,t);
  say(`演示中 ${i+1}/${seq.length}：第 ${ROMAN[f]} 根 → 第 ${ROMAN[t]} 根`);
  demoTimer=setTimeout(()=>playDemo(seq,i+1),DEMO_STEP);
}
function startDemo(){
  stopDemo();
  newGame();                                 // 先重置到开局，保证演示的是完整解法
  demo=true; done=true;                      // 演示期间锁住手动拖动
  giveUpBtn.textContent='停止演示';
  say(`好的，看一遍 ${N} 个圆盘的最少步数解法。`);
  playDemo(solve(N,0,2,1,[]),0);
}
giveUpBtn.addEventListener('click',function(){
  if(demo){
    stopDemo();
    newGame();
    say('演示已停止。点「新的一局」自己试试，或再点一次「放弃 · 看解法」重看。');
    return;
  }
  startDemo();
});

$('#btnNew').addEventListener('click',newGame);
$('#btnSound').addEventListener('click',function(){
  soundOn=!soundOn;
  this.textContent=soundOn?'🔊':'🔇';
  if(soundOn) beep(660,0.07);
});
build(); showRecord();
</script>
</body>
</html>
